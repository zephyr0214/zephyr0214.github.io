<script src="/assets/js/main.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (document.documentElement.classList.contains('ui-en')) {
      document.querySelectorAll('a[data-en-href]').forEach(function (a) {
        a.setAttribute('href', a.getAttribute('data-en-href'));
      });
    }
    var filter = document.querySelector('.tag-filter');
    if (!filter) return;
    var items = Array.prototype.slice.call(document.querySelectorAll('.post-item'));
    filter.addEventListener('click', function (e) {
      var btn = e.target.closest('.tag-btn');
      if (!btn) return;
      var tag = btn.getAttribute('data-tag');
      Array.prototype.forEach.call(filter.querySelectorAll('.tag-btn'), function (b) {
        b.classList.toggle('active', b === btn);
      });
      items.forEach(function (item) {
        var tags = (item.getAttribute('data-tags') || '').split(',');
        item.style.display = (tag === 'all' || tags.indexOf(tag) !== -1) ? '' : 'none';
      });
    });
  });
</script>
