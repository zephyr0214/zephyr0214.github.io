<meta charset="utf-8">

{% include seo.html %}

<style>
  .i18n.en { display: none; }
  .ui-en .i18n.zh { display: none; }
  .ui-en .i18n.en { display: inline; }
  .post-excerpt {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tag-filter {
    margin-bottom: 1em;
  }
  .tag-btn {
    display: inline-block;
    margin: 0 0.25em 0.25em 0;
    padding: 0.2em 0.7em;
    border: 1px solid #ccc;
    border-radius: 3px;
    background: #f7f7f7;
    color: #333;
    cursor: pointer;
    font-size: 0.85em;
  }
  .tag-btn.active {
    background: #52adc8;
    border-color: #52adc8;
    color: #fff;
  }
</style>
<script>
  (function () {
    var m = location.search.match(/[?&]lang=(en|zh)/i);
    if (!m) return;
    var root = document.documentElement;
    if (m[1] === 'en') {
      root.classList.add('ui-en');
      root.lang = 'en';
    } else {
      root.classList.remove('ui-en');
      root.lang = 'zh-CN';
    }
  })();
</script>

<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="/assets/css/main.css">

<meta http-equiv="cleartype" content="on">
