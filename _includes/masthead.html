<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="/#about-me">{% if page.lang == 'en' %}Homepage{% else %}首页{% endif %}</a></li>
          {% assign nav_items = site.data.navigation[page.lang] | default: site.data.navigation.zh %}
          {% for link in nav_items %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
          <li class="masthead__menu-item masthead__menu-lang-item"><a href="{% if page.lang == 'en' %}/{% else %}/en/{% endif %}">{% if page.lang == 'en' %}中文{% else %}EN{% endif %}</a></li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
